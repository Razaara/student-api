# Must match the SonarQube project your analysis TOKEN belongs to.
# Current token is a Project Analysis Token for project key: jenkins
sonar.projectKey=jenkins
sonar.projectName=jenkins
sonar.projectVersion=1.0

sonar.sources=src/main/java
sonar.java.binaries=target/classes
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/target/**,**/*.class
